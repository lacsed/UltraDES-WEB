name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test UltraDESWeb.Tests/UltraDESWeb.Tests.csproj -c Release --nologo
      - run: npm ci
      - run: npm run test:editor
      - run: npm run browsers:install -- --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
