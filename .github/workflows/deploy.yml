name: Deploy to GitHub Pages

# Run workflow on every push to the main branch or manually
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  BASE_HREF: /UltraDES-WEB/

jobs:
  deploy-to-github-pages:
    # use ubuntu-latest image to run steps on
    runs-on: ubuntu-latest
    steps:
      # uses GitHub's checkout action to checkout code from the current repository
      - uses: actions/checkout@v4
        with:
          safe-directory: true
      # sets up .NET SDK 8.0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # publishes Blazor project to the release-folder
      - name: Publish .NET Core Project
        run: dotnet publish UltraDESWeb.csproj -c Release -o release --nologo
      # changes the base-tag in index.html from '/' to '/UltraDES-WEB/' to match GitHub Pages repository subdirectory
      - name: Change base-tag in index.html from / to /UltraDES-WEB/
        run: sed -i "s/<base href=\"\/\" \/>/<base href=\"$BASE_HREF\" \/>/g" release/wwwroot/index.html
      # add .nojekyll file to tell GitHub pages to not treat this as a Jekyll project. (Allow files and folders starting with an underscore)
      - name: Add .nojekyll file
        run: touch release/wwwroot/.nojekyll
      - name: Commit wwwroot to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ultrades-interactive
          folder: release/wwwroot
